<title>Jardim do Sossego</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* layout: a full-bleed 3D garden; soft paper cards float at the edges, never over the centre where the gardener works */
:root{
  --ink:#2c4535; --ink-soft:#5d7565; --paper:#fbfaf1; --paper-2:#eef3e0; --line:#dfe6cf;
  --leaf:#5e9c55; --leaf-d:#3f7c46; --honey:#f0b23a; --honey-d:#c98a16; --rose:#e2685f; --water:#4c9fdb;
  --shadow:0 6px 22px rgba(30,55,38,.22); --r:18px;
  --display:'Fredoka','Nunito',ui-rounded,'Segoe UI',system-ui,sans-serif; --body:'Nunito',ui-rounded,'Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:#a9cfe6;color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-0.2em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--water);outline-offset:2px}
#ui{position:fixed;inset:0;pointer-events:none;padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;opacity:0;transition:opacity .8s .6s}
body.playing #ui{opacity:1}
body.photo #ui>*:not(#photo-exit),body.photo #tags,body.photo #floats{display:none!important}
#ui>*{pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none!important}
.top>*{pointer-events:auto}
#hud{display:flex;flex-direction:column;gap:8px;min-width:0;max-width:min(330px,72vw)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:999px;padding:6px 12px 6px 8px;box-shadow:var(--shadow);font-family:var(--display);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.pill .ic{width:22px;height:22px}
.pill.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.14)}}
.say{position:absolute;transform:translate(-50%,-100%);max-width:190px;padding:7px 12px;border-radius:14px 14px 14px 4px;background:var(--paper);color:var(--ink);font-weight:700;font-size:13px;line-height:1.25;box-shadow:var(--shadow);animation:tin .25s ease-out;pointer-events:none;text-align:center}
.hearts{letter-spacing:1px;font-size:15px;white-space:nowrap} .hearts i{font-style:normal;color:#d9d3c4} .hearts i.on{color:#e2685f} .bighearts .hearts{font-size:30px}
.c-face{display:grid;place-items:center;color:#e2685f} .c-face .ic{width:40px;height:40px} .c-say{font-size:14px;font-weight:700;line-height:1.3;background:var(--paper-2);border-radius:12px 12px 12px 4px;padding:7px 10px}
.c-gifts{display:flex;flex-wrap:wrap;gap:6px} .c-gifts .chip{cursor:pointer;border:0;font:inherit;font-weight:800} .c-gifts .chip.fav{box-shadow:0 0 0 2px #e2685f inset}
.friends{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:6px 0 12px} .friend{background:var(--paper-2);border-radius:14px;padding:9px 11px;display:flex;flex-direction:column;gap:2px;opacity:.6} .friend.got{opacity:1} .friend b{font-family:var(--display);font-weight:600} .friend small{color:var(--ink-soft);font-weight:700;font-size:12px}
@keyframes pgR{from{transform:translateX(34px);opacity:.25}} @keyframes pgL{from{transform:translateX(-34px);opacity:.25}} .seeds.inR{animation:pgR .2s ease-out} .seeds.inL{animation:pgL .2s ease-out}
.pill.lvl{padding-right:10px}
.pill.lvl .lv{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--leaf);color:#fff;font-size:14px}
.pill.lvl .bar{width:54px}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;flex:1;min-width:30px}
.bar i{display:block;height:100%;border-radius:8px;background:var(--leaf);transition:width .5s}
.bar.w i{background:var(--water)} .bar.c i{background:var(--honey)}
#quest{background:var(--paper);border-radius:var(--r);padding:9px 13px 10px;box-shadow:var(--shadow);font-size:14px;line-height:1.25}
.q-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:800}
.q-t{font-family:var(--display);font-weight:500;font-size:16px;margin:1px 0 6px;text-wrap:balance}
.q-r{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.q-r b{display:flex;align-items:center;gap:3px;color:var(--honey-d)}
#menu{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:112px}
.round{width:48px;height:48px;border-radius:50%;background:var(--paper);box-shadow:var(--shadow);display:grid;place-items:center;transition:transform .15s}
.round:hover{transform:translateY(-2px)} .round:active{transform:scale(.94)}
.round .ic{width:24px;height:24px}
.grow{flex:1;pointer-events:none!important}
#toasts{position:absolute;left:50%;top:max(84px,18%);transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;width:min(92%,440px);pointer-events:none!important}
.toast{background:rgba(251,250,241,.96);padding:9px 16px;border-radius:999px;box-shadow:var(--shadow);font-weight:800;font-size:14.5px;text-align:center;animation:tin .35s;transition:opacity .45s,transform .45s}
.toast.good{background:#e9f6dc;color:var(--leaf-d)} .toast.warn{background:#fdeedd;color:#a4551c}
.toast.out{opacity:0;transform:translateY(-8px)}
@keyframes tin{from{opacity:0;transform:translateY(10px) scale(.96)}}
#floats,#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#tags{opacity:0;visibility:hidden;transition:opacity .8s .8s}
body.playing #tags{opacity:1;visibility:visible}
.float{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-weight:700;font-size:22px;color:#fff;text-shadow:0 2px 0 rgba(120,80,0,.55),0 0 10px rgba(255,200,60,.8);display:flex;align-items:center;gap:4px;animation:fl 1.5s ease-out forwards}
@keyframes fl{0%{opacity:0;margin-top:10px}15%{opacity:1}100%{opacity:0;margin-top:-70px}}
.ztag{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:5px;background:rgba(251,250,241,.9);border-radius:999px;padding:3px 9px 3px 6px;box-shadow:0 2px 8px rgba(30,55,38,.22);white-space:nowrap;will-change:transform}
.ztag>.ic{width:13px;height:13px;color:var(--ink-soft)}
.ztag small{display:flex;align-items:center;gap:3px;font-family:var(--display);font-weight:600;font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.ztag small .ic{width:13px;height:13px}
.ztag.can{background:#fff7dc;animation:glow 1.8s infinite}
.ztag.can small{color:var(--honey-d)}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(240,178,58,.35),0 2px 8px rgba(30,55,38,.22)}}
/* bottom sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(30,55,38,.25);padding:12px 0 max(10px,env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.3,1);max-height:min(64%,540px);display:flex;flex-direction:column}
#sheet.on{transform:none}
#sheet:not(.on),#card:not(.on){visibility:hidden;transition:transform .32s cubic-bezier(.2,.9,.3,1),visibility 0s .32s}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:0 max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.sheet-h b{font-family:var(--display);font-weight:600;font-size:19px;display:block}
.sheet-h span{font-size:13px;color:var(--ink-soft);font-weight:700}
.x{width:38px;height:38px;border-radius:50%;background:var(--paper-2);display:grid;place-items:center;flex:none}
.chipsrow{display:flex;gap:6px;flex-wrap:wrap;padding:0 max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.chipsrow.in{padding:0 0 10px}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--paper-2);font-family:var(--display);font-weight:500;font-size:13.5px;color:var(--ink)}
.fchip i{font-style:normal;font-family:var(--body);font-size:11px;font-weight:800;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.fchip.on{background:var(--leaf);color:#fff} .fchip.on i{color:#e4f2d8}
.fchip.fill{margin-left:auto;background:#fff;border:2px dashed var(--honey);padding:4px 12px;color:var(--honey-d)}
.fchip.fill.on{background:var(--honey);border-style:solid;color:#4a3206}
.pager{display:flex;align-items:center;gap:6px;margin-left:auto;margin-right:8px;font-family:var(--display);font-weight:500;font-size:13.5px;color:var(--ink-soft)} .pager button{width:34px;height:34px;border-radius:50%;background:var(--paper-2);font-size:20px;line-height:1;color:var(--ink);display:grid;place-items:center} .pager button[disabled]{opacity:.35}
.seeds{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;align-content:start;overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;padding:2px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));touch-action:pan-y;scrollbar-width:thin}
.seed{background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 6px 7px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;transition:transform .15s,border-color .15s}
.seed:hover{border-color:var(--leaf);transform:translateY(-2px)}
.seed .th{position:relative;height:66px;border-radius:10px;background:radial-gradient(circle at 50% 70%,#f3f8e6,#dcebd0);display:grid;place-items:center;overflow:hidden}
.seed img{width:66px;height:66px;object-fit:contain}
.seed b{font-family:var(--display);font-weight:600;font-size:12.5px;line-height:1.1;margin-top:2px;min-height:2.2em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;justify-content:space-between;gap:2px;font-size:11px;font-weight:800;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.meta span{display:flex;align-items:center;gap:2px} .meta .ic{width:12px;height:12px}
.meta .price{color:var(--honey-d)}
.soon{grid-column:1/-1;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--ink-soft);margin-top:4px}
.seed .fav{position:absolute;right:4px;top:4px;width:20px;height:20px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 4px rgba(30,55,38,.25)} .seed .fav .ic{width:14px;height:14px}
.seed.poor .price{color:var(--rose)} .seed.poor{opacity:.72}
.seed.locked img{filter:grayscale(1) brightness(1.25);opacity:.45}
.seed.locked em{position:absolute;inset:auto 0 5px;text-align:center;font-style:normal;font-family:var(--display);font-weight:600;font-size:11.5px;color:var(--ink)}
.seed.locked .meta{opacity:.5}
/* plant card */
#card{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom,0px));width:min(400px,calc(100% - 32px));transform:translate(-50%,140%);transition:transform .3s cubic-bezier(.2,.9,.3,1);background:var(--paper);border-radius:22px;box-shadow:var(--shadow);padding:12px;display:flex;gap:12px;align-items:center}
#card.on{transform:translate(-50%,0)}
.c-th{width:84px;height:84px;border-radius:14px;background:radial-gradient(circle at 50% 70%,#f3f8e6,#dcebd0);object-fit:contain;flex:none}
.c-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.c-n{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.c-n b{font-family:var(--display);font-weight:600;font-size:18px}
.c-n span{font-size:12.5px;font-weight:800;color:var(--leaf-d)}
.c-row{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft);font-weight:700}
.c-row small{width:92px;text-align:right;flex:none}
.c-act{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
#card .c-act .btn{padding:7px 13px;font-size:14px} .c-n span .ic{width:15px;height:15px;vertical-align:-3px;margin-right:2px} .btn.ghost.on{box-shadow:0 0 0 2px var(--leaf) inset}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--leaf);color:#fff;font-family:var(--display);font-weight:600;font-size:15px;padding:8px 16px;border-radius:999px;box-shadow:0 3px 0 var(--leaf-d);transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--leaf-d)}
.btn.ghost{background:var(--paper-2);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn.danger{color:var(--rose)}
.btn.big{font-size:18px;padding:11px 26px}
.btn[disabled]{filter:grayscale(.8);opacity:.55;cursor:default}
/* season pill, card notes */
.pill.season{font-size:13.5px;padding:6px 11px 6px 8px;cursor:pointer}
.pill.season .ic{width:18px;height:18px}
.c-info{font-size:12.5px;font-weight:700;color:var(--ink-soft);line-height:1.3}
.c-note{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--leaf-d)}
.btn.honey{background:var(--honey);box-shadow:0 3px 0 var(--honey-d);color:#4a3206}
/* orders, daily, achievements, diary */
.orders{display:flex;flex-direction:column;gap:10px}
.order{background:#fff;border:2px solid var(--line);border-radius:18px;padding:11px 12px;display:flex;flex-direction:column;gap:8px}
.order.ok{border-color:var(--honey);background:#fffaea}
.o-h b{font-family:var(--display);font-weight:600;font-size:16.5px;margin-right:6px}
.o-h span{font-size:13px;font-weight:700;color:var(--ink-soft)}
.o-items{display:flex;gap:8px;flex-wrap:wrap}
.o-it{display:flex;flex-direction:column;align-items:center;width:78px;background:var(--paper-2);border-radius:12px;padding:4px 4px 6px;text-align:center}
.o-it img{width:56px;height:56px;object-fit:contain}
.o-it b{font-family:var(--display);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.o-it small{font-size:10.5px;font-weight:800;color:var(--ink-soft);line-height:1.1}
.o-it.full{background:#e6f3d6} .o-it.full b{color:var(--leaf-d)}
.o-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rew{flex:1;display:flex;align-items:center;gap:5px;font-family:var(--display);font-weight:600;font-size:17px;color:var(--honey-d);font-variant-numeric:tabular-nums;min-width:90px}
.rew i{font-style:normal;font-family:var(--body);font-size:12.5px;font-weight:800;color:var(--leaf-d)}
.basket{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:14px;padding-top:12px;border-top:2px solid var(--paper-2)}
.basket>b{font-family:var(--display);font-weight:600;font-size:15px;margin-right:4px}
.basket small{font-weight:700;color:var(--ink-soft)}
.chip{display:inline-flex;align-items:center;gap:3px;background:var(--paper-2);border-radius:999px;padding:2px 10px 2px 3px;font-family:var(--display);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.chip img{width:28px;height:28px;object-fit:contain}
.chip.adubo{padding-left:8px;background:#e6f3d6;color:var(--leaf-d);font-size:13px}
.empty{padding:14px 0}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:12px 0}
.day{background:var(--paper-2);border-radius:12px;padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent}
.day small{font-size:10px;font-weight:800;color:var(--ink-soft)}
.day .ic{width:22px;height:22px}
.day b{font-family:var(--display);font-weight:600;font-size:11.5px;line-height:1.1;font-variant-numeric:tabular-nums}
.day.done{opacity:.45} .day.now{border-color:var(--honey);background:#fff7dc;animation:glow 1.8s infinite} .day.big{background:#fdeedd}
.item.ach{justify-content:flex-start}
.a-ic .ic{width:34px;height:34px}
.a-b{flex:1;min-width:0}
.a-b .q-r{margin-top:5px}
.toast.ach{display:flex;align-items:center;gap:10px;background:#fff7dc;border-radius:18px;padding:8px 16px 8px 10px;text-align:left}
.toast.ach>.ic{width:34px;height:34px}
.toast.ach small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--honey-d)}
.toast.ach b{font-family:var(--display);font-weight:600;font-size:16px}
.toast.ach i{font-style:normal;display:flex;align-items:center;gap:3px;font-family:var(--display);font-weight:600;color:var(--honey-d)}
.diary{display:flex;flex-direction:column;gap:2px}
.diary div{padding:8px 4px;border-bottom:2px dotted var(--line);font-weight:700;line-height:1.35}
.diary span{display:inline-block;min-width:54px;font-family:var(--display);font-weight:600;color:var(--leaf-d);margin-right:6px}
.alb em{font-style:normal;font-size:10px;font-weight:800;color:var(--honey-d);text-transform:uppercase;letter-spacing:.05em}
.tabs{overflow-x:auto;scrollbar-width:none} .tabs button{white-space:nowrap;padding-inline:12px}
.albgrid.crit{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
.alb small{font-size:11px;font-weight:700;color:var(--ink-soft);line-height:1.25;margin-top:2px}
.albgrid.crit .alb:not(.got) img{filter:brightness(0) opacity(.14)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:9px}
.dcard{background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 9px 9px;text-align:left;display:flex;flex-direction:column;gap:3px;transition:transform .15s,border-color .15s}
.dcard:hover{border-color:var(--leaf);transform:translateY(-3px)}
.dcard .th{position:relative;height:96px;border-radius:11px;background:radial-gradient(circle at 50% 70%,#f3f8e6,#dcebd0);display:grid;place-items:center;overflow:hidden}
.dcard img{width:96px;height:96px;object-fit:contain}
.dcard .th em{position:absolute;right:5px;top:5px;font-style:normal;font-size:10px;font-weight:800;background:var(--leaf);color:#fff;border-radius:999px;padding:2px 7px}
.dcard b{font-family:var(--display);font-weight:600;font-size:14.5px;line-height:1.1;margin-top:3px}
.dcard small{font-size:11.5px;line-height:1.25;color:var(--ink-soft);font-weight:700;flex:1}
.dprice{display:flex;align-items:center;gap:4px;font-family:var(--display);font-weight:600;font-size:14px;color:var(--honey-d);font-variant-numeric:tabular-nums}
.dprice.have{color:var(--leaf-d);font-size:12.5px}
.dcard.lk img{filter:grayscale(1) brightness(1.2);opacity:.5} .dcard.lk .dprice{color:var(--ink-soft)}
#placebar{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 32px));transform:translate(-50%,160%);transition:transform .3s cubic-bezier(.2,.9,.3,1);background:var(--paper);border-radius:22px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:9px;align-items:center;text-align:center;visibility:hidden}
#placebar.on{transform:translate(-50%,0);visibility:visible}
#placebar span{font-weight:800;font-size:14px;color:var(--ink-soft)} #placebar span b{color:var(--ink);font-family:var(--display);font-weight:600;font-size:15.5px}
#placebar div{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
body.placing #hud #quest,body.placing #menu,body.placing #tags{display:none}
.swatches{display:flex;flex-wrap:wrap;gap:4px}
.sw{display:flex;flex-direction:column;align-items:center;gap:3px;width:62px;padding:5px 1px;border-radius:14px;border:2px solid transparent}
.sw i{width:38px;height:38px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12),0 2px 6px rgba(30,55,38,.25);border:3px solid #fff}
.sw small{font-size:10.5px;font-weight:800;color:var(--ink-soft);line-height:1.1;display:flex;align-items:center;gap:2px;text-align:center}
.sw small .ic{width:12px;height:12px}
.sw i.fab{border-radius:12px;background-size:230px 58px;background-position:center}
.sw i.none{background:repeating-linear-gradient(45deg,#fff,#fff 4px,#e8ecdc 4px,#e8ecdc 8px)}
